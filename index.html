<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMart — Filter (Buoi 7)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cm-header">
        <h1 data-testid="cm-brand">CampusMart</h1>
        
        <nav data-testid="cm-nav" aria-label="Menu chinh">
            <ul class="cm-nav">
                <li><a href="#categories">Trang chu</a></li>
                <li><a href="#products">San pham</a></li>
                <li><a href="#subscribe">Dang ky</a></li>
                <li><a href="#about">Gioi thieu</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero" class="cm-hero" data-testid="cm-hero">
            <h2>Chao mung den voi CampusMart</h2>
            <p>Trang bi cong nghe - Tiep buoc thanh cong</p>
        </section>

        <section id="stats" data-testid="cm-stats" aria-live="polite"></section>

        <section id="categories">
            <ul data-testid="cm-category-list">
                <li>Ban phim</li>
                <li>Chuot</li>
                <li>Man hinh</li>
            </ul>
        </section>

        <section id="products">
            <!-- Bộ lọc danh mục và Sắp xếp -->
            <div style="margin-bottom: 1rem;">
                <label for="filter-cat">Loc theo danh muc</label>
                <select id="filter-cat" data-testid="cm-filter-category">
                    <option value="all">Tat ca</option>
                    <option value="1">Ban phim</option>
                    <option value="2">Chuot</option>
                    <option value="3">Man hinh</option>
                </select>
                <button type="button" id="sort-price" style="margin-left: 1rem; padding: 0.4rem 0.8rem; cursor: pointer;">Gia tang dan</button>
            </div>
            
            <p data-testid="cm-visible-count"></p>

            <!-- Khung lưới để TRỐNG để JS tự render động -->
            <div class="cm-grid" data-testid="cm-product-table"></div>

            <div data-testid="cm-inventory-total" style="margin-top: 1rem;">
                <p>Tong gia tri kho = 41380000</p>
                <p>So san pham = 8</p>
            </div>
        </section>

        <section id="subscribe">
            <form data-testid="cm-subscribe-form">
                <fieldset>
                    <legend>Dang ky nhan tin</legend>
                    
                    <div>
                        <label for="sub-name">Ho ten</label>
                        <input type="text" id="sub-name" name="name" required minlength="2">
                    </div>

                    <div>
                        <label for="sub-email">Email</label>
                        <input type="email" id="sub-email" name="email" required>
                    </div>

                    <div>
                        <label for="sub-category">Danh muc quan tam</label>
                        <select id="sub-category" name="category_id" required>
                            <option value="">-- Chon danh muc --</option>
                            <option value="1">Ban phim</option>
                            <option value="2">Chuot</option>
                            <option value="3">Man hinh</option>
                        </select>
                    </div>

                    <button type="submit">Dang ky</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer id="about">
        <h2>Gioi thieu lien he</h2>
        <form>
            <div>
                <label for="contact-name">Ho ten</label>
                <input type="text" id="contact-name" name="contact_name" required>
            </div>
            <div>
                <label for="contact-msg">Noi dung</label>
                <textarea id="contact-msg" name="message" rows="4" required></textarea>
            </div>
            <button type="submit">Gui</button>
        </form>
        
        <p>CSE391 / Buoi 7</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>

    <!-- CM_EXPECT product_count=8 filter_counts=8,3,3,2 first_sorted_sku=MS-03 -->
</body>
</html>
